<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0d0f17" />
    <!-- Sets the theme before first paint. External (not inline) because the
         Content-Security-Policy in public/_headers allows no inline scripts. -->
    <script src="/theme-init.js"></script>
    <title>take5</title>
    <meta
      name="description"
      content="Five-second AI videos, straight from your browser with your own API key. Nothing is tracked, recorded or saved anywhere but on your device."
    />
    <!-- Link previews (Signal, Messenger, Slack, iMessage…): absolute URLs
         are required, so these always point at the production host. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="take5.lgtm.page" />
    <meta property="og:title" content="take5" />
    <meta
      property="og:description"
      content="Five-second AI videos, straight from your browser with your own API key. Nothing is tracked, recorded or saved anywhere but on your device."
    />
    <meta property="og:url" content="https://take5.lgtm.page/" />
    <meta property="og:image" content="https://take5.lgtm.page/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="take5 with a clapperboard beside a short strip of video frames."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="take5" />
    <meta
      name="twitter:description"
      content="Five-second AI videos, straight from your browser with your own API key."
    />
    <meta name="twitter:image" content="https://take5.lgtm.page/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
